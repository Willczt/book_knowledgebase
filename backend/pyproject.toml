[project]
name = "book-knowledgebase"
version = "0.1.0"
description = "生产级电子书 RAG 知识库系统"
requires-python = ">=3.11"

dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",

    # 数据库
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # 向量数据库
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",

    # 配置
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",

    # LLM / Embedding
    "openai>=1.55.0",
    "volcenginesdkarkruntime>=0.1.0",
    "httpx>=0.27.0",

    # 文档解析
    "pymupdf>=1.24.14",
    "ebooklib>=0.18.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "mistune>=3.0.2",
    "pillow>=10.4.0",

    # 检索
    "flashrank>=0.2.9",

    # 工具
    "typer>=0.13.0",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "uuid7>=0.1.0",
]

[project.scripts]
bookrag = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "cli"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "storage", "db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
# 说明：以下规则属于「历史代码待清理」，不阻塞新代码；
# 清理完可逐条从 ignore 中移除（避免一次性大范围改写引入风险）。
ignore = [
    "E501",   # 行宽由 formatter 处理
    "B008",   # FastAPI 依赖注入默认值写法
    "B904",   # 异常链：历史 API 层未补 from e
    "B007",   # 循环变量未使用
    "B027",   # 空基类方法
    "N818",   # 异常类命名后缀
    "UP035",  # 保持 typing.Optional 写法，暂不做全量改写
    "UP042",  # str 枚举
    "UP045",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
